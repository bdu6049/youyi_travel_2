      <circle cx="83" cy="139" r="5"/><circle cx="279" cy="139" r="5"/><circle cx="396" cy="139" r="5"/>
      <circle cx="631" cy="90" r="5"/><circle cx="450" cy="283" r="5"/>
    </g>
    <g fill="#f5f7ef" stroke="#674c83" stroke-width="3">
