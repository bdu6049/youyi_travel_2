      <text x="396" y="119">集贤</text><text x="631" y="75">富锦</text><text x="708" y="75">同江</text>
      <text x="606" y="152" fill="#a13527" font-size="25">友谊县</text><text x="519" y="291">双鸭山市区</text>
    </g>
    <g fill="#54665b" font-size="16" font-weight="600">
