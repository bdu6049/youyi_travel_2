      <path d="M279 173C306 173 304 241 336 241H427" stroke="#9c491d" stroke-width="4.5" stroke-dasharray="8 7"/>
      <path d="M427 241H606Q626 241 643 213L677 181H717" stroke="#9c491d" stroke-width="4.5" stroke-dasharray="8 7"/>
      <path d="M372 207V254L450 283M606 176V241" stroke="#99a698" stroke-width="2" stroke-dasharray="2 6"/>
    </g>
    <g fill="#e3ebe1" stroke="#a4b4a5" stroke-width="1">
      <rect x="71" y="127" width="24" height="58" rx="12"/><rect x="267" y="127" width="24" height="58" rx="12"/>
    </g>
