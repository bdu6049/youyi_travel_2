<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" role="img" aria-labelledby="title desc">
  <title id="title">黑龙江东部公路铁路示意图</title>
  <desc id="desc">哈尔滨与佳木斯以哈同高速和哈佳铁路相连。从佳木斯可经牡佳高铁到双鸭山西站。通往友谊的普速铁路由东佳木斯经佳富铁路到福利屯，再接福前铁路到新友谊站。线路与距离不按比例。</desc>
  <rect width="760" height="372" fill="#f5f7ef"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="34" y="44" fill="#203b31" font-size="26" font-weight="700">黑龙江东部交通</text>
    <text x="34" y="70" fill="#55665a" font-size="16">示意图 · 线路与距离不按比例</text>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
